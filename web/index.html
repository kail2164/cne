<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conflict Never Ends</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <h1>Conflict Never Ends</h1>
        <p class="tag">1910 logistics — browser shell over core</p>
      </header>

      <nav class="tabs" id="main-tabs" aria-label="Company">
        <button type="button" class="tab" data-tab="arsenal">Arsenal</button>
        <button type="button" class="tab" data-tab="barracks">Barracks</button>
        <button type="button" class="tab" data-tab="production">Production</button>
        <button type="button" class="tab" data-tab="research">Research</button>
        <button type="button" class="tab" data-tab="contract">Contract</button>
      </nav>

      <section id="status" class="panel"></section>

      <section class="panel toolbar">
        <button type="button" class="primary" id="btn-end">End turn</button>
      </section>

      <section id="view" class="panel view"></section>

      <section class="panel">
        <h2>Log</h2>
        <pre id="log" class="log"></pre>
      </section>
    </div>

    <div id="start-gate" class="gate" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
